# OpenHands Multi-Agent Configuration for Milk-V Duo XmrSigner

[core]
workspace_base = "./"
default_agent = "CodeActAgent"
max_iterations = 100
enable_auto_lint = true

[llm]
# Example configuration for GLM-5 / GLM-4 / OpenAI-compatible endpoint
model = "glm-5"
base_url = "https://open.bigmodel.cn/api/paas/v4"
# api_key = "YOUR_ZHIPU_OR_OPENHANDS_API_KEY"
temperature = 0.1
max_tokens = 4096

[agent]
# Multi-agent collaboration settings
memory_enabled = true
enable_browsing = true
enable_cmd = true
